environment: production
description: Production overlay for the Hyperfy live service footprint.
variables:
  - name: HYPERFY_ENVIRONMENT
    source: static
    value: production
  - name: FASTIFY_PUBLIC_URL
    source: static
    value: https://api.hyperfy.example
  - name: FASTIFY_JWT_SECRET
    source: secret
    provider: aws-secretsmanager
    secret: hyperfy/production/server
    field: jwt_secret
  - name: FASTIFY_ADMIN_CODE
    source: secret
    provider: aws-secretsmanager
    secret: hyperfy/production/server
    field: admin_code
  - name: LIVEKIT_URL
    source: static
    value: wss://livekit.hyperfy.example
  - name: LIVEKIT_API_KEY
    source: secret
    provider: aws-secretsmanager
    secret: hyperfy/production/livekit
    field: api_key
  - name: LIVEKIT_API_SECRET
    source: secret
    provider: aws-secretsmanager
    secret: hyperfy/production/livekit
    field: api_secret
  - name: DATABASE_URL
    source: secret
    provider: aws-secretsmanager
    secret: hyperfy/production/database
    field: url
  - name: CDN_BUCKET_NAME
    source: static
    value: hyperfy-prod-assets
  - name: CDN_PUBLIC_URL
    source: static
    value: https://cdn.hyperfy.example
  - name: CDN_SIGNING_KEY
    source: secret
    provider: aws-secretsmanager
    secret: hyperfy/production/cdn
    field: signing_key
  - name: SIM_RPC_ENDPOINT
    source: static
    value: https://sim.hyperfy.example
  - name: SIM_CLUSTER_TOKEN
    source: secret
    provider: aws-secretsmanager
    secret: hyperfy/production/sim
    field: cluster_token
  - name: OBSERVABILITY_OTLP_ENDPOINT
    source: static
    value: https://otlp.hyperfy.example
