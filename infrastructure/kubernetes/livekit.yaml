apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: livekit
  namespace: hyperfy-apps
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: aws
    kind: ClusterSecretStore
  target:
    name: livekit-env
    creationPolicy: Owner
  data:
    - secretKey: LIVEKIT_API_KEY
      remoteRef:
        key: hyperfy/production/livekit
        property: api_key
    - secretKey: LIVEKIT_API_SECRET
      remoteRef:
        key: hyperfy/production/livekit
        property: api_secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: hyperfy-apps
  labels:
    app: livekit
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      serviceAccountName: livekit
      containers:
        - name: livekit
          image: ghcr.io/hyperfy-xyz/livekit:latest
          args:
            - "--config=/etc/livekit/config.yaml"
          ports:
            - name: http
              containerPort: 7880
            - name: rtc
              containerPort: 7881
              protocol: UDP
          envFrom:
            - secretRef:
                name: livekit-env
          env:
            - name: LIVEKIT_LOG_LEVEL
              value: info
            - name: LIVEKIT_REGION
              value: us-east-1
          resources:
            requests:
              cpu: 500m
              memory: 1024Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: hyperfy-apps
  labels:
    app: livekit
data:
  config.yaml: |
    rtc:
      tcp_port: 7881
    turn:
      enabled: true
      tls_port: 5349
    keys:
      ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: hyperfy-apps
  labels:
    app: livekit
spec:
  selector:
    app: livekit
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: rtc
      port: 7881
      targetPort: rtc
      protocol: UDP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: livekit
  namespace: hyperfy-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: livekit
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: livekit
  namespace: hyperfy-apps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: livekit
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: livekit
  namespace: hyperfy-apps
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/hyperfy-livekit
