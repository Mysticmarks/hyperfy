apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sim
  namespace: hyperfy-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws
    kind: ClusterSecretStore
  target:
    name: sim-env
    creationPolicy: Owner
  data:
    - secretKey: SIM_CLUSTER_TOKEN
      remoteRef:
        key: hyperfy/production/sim
        property: cluster_token
    - secretKey: HYPERFY_JWT_SECRET
      remoteRef:
        key: hyperfy/production/server
        property: jwt_secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim
  namespace: hyperfy-apps
  labels:
    app: sim
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sim
  template:
    metadata:
      labels:
        app: sim
    spec:
      serviceAccountName: sim
      containers:
        - name: sim
          image: ghcr.io/hyperfy-xyz/hyperfy-sim:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 7000
          envFrom:
            - secretRef:
                name: sim-env
          env:
            - name: SIM_RPC_ENDPOINT
              value: https://sim.hyperfy.example
          resources:
            requests:
              cpu: 500m
              memory: 1024Mi
            limits:
              cpu: 1500m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: grpc
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sim
  namespace: hyperfy-apps
  labels:
    app: sim
spec:
  type: ClusterIP
  selector:
    app: sim
  ports:
    - name: grpc
      port: 7000
      targetPort: grpc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sim
  namespace: hyperfy-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sim
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sim
  namespace: hyperfy-apps
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sim
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sim
  namespace: hyperfy-apps
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/hyperfy-sim
